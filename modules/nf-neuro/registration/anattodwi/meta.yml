# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: registration_anattodwi
description: |
  Registration computing transformations moving images from anatomical space into diffusion space. The `moving_image`
  represents the anatomical space, moving to diffusion space, onto its `fixed_image` and its `metric` representations.

  Configuration, direction and order of the registration follows the [tractoflow](https://doi.org/10.1016/j.neuroimage.2020.116889)
  publication.
keywords:
  - nifti
  - registration
  - anatomical
  - dwi
tools:
  - ANTs:
      description: "Advanced Normalization Tools."
      homepage: "https://github.com/ANTsX/ANTs"
      documentation: "http://stnava.github.io/ANTsDoc/"
      doi: "10.1038/s41598-021-87564-6"
  - ImageMagick:
      description: "ImageMagick is a software suite to create, edit, compose, or convert bitmap images."
      homepage: "https://imagemagick.org/"
      documentation: "https://imagemagick.org/script/command-line-processing.php"
  - MRtrix3:
      description: "MRtrix3 is a software package for processing diffusion MRI data."
      homepage: "https://www.mrtrix3.org/"
      documentation: "https://mrtrix.readthedocs.io/en/latest/"
      doi: "10.1016/j.neuroimage.2019.116137"
  - Scilpy:
      description: "Scilpy is a Python library for processing diffusion MRI data."
      homepage: "https://github.com/scilus/scilpy"
      documentation: "https://scilpy.readthedocs.io/en/latest/"
args:
  - suffix:
      type: string
      description: |
        Custom suffix to add to the output file name. In any case, the suffix "_warped"
        will be appended to the supplied suffix or directly used to prevent overwriting input files.
        e.g. : the suffix `to_T1w` will result in the name `image_to_T1w_warped.nii.gz`.
      default: "warped"
  - run_qc:
      type: boolean
      description: "Run quality control for the registration process"
      default: false
  - suffix_qc:
      type: string
      description: "Suffix for the QC image file."
      default: ""
  - single_thread:
      type: boolean
      description: If true, the command will be run in single-threaded mode. By default, the command will use multiple threads based on the number of CPUs allocated to the task.
      default: false
  - ants_rng_seed:
      type: integer
      description: Random seed for ANTs registration. Setting a fixed seed can help with reproducibility of results.
      default: 1234
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - fixed_image:
        type: file
        description: Nifti image file - fixed DWI image (usually b0)
        pattern: "*.{nii,nii.gz}"
        mandatory: true
        ontologies:
          - edam: http://edamontology.org/format_4001 # NIFTI format
    - moving_image:
        type: file
        description: Nifti image file - moving image to register (usually T1w)
        pattern: "*.{nii,nii.gz}"
        mandatory: true
        ontologies:
          - edam: http://edamontology.org/format_4001 # NIFTI format
    - metric:
        type: file
        description: Nifti image file - additional fixed metric (usually FA)
        pattern: "*.{nii,nii.gz}"
        mandatory: true
        ontologies:
          - edam: http://edamontology.org/format_4001 # NIFTI format
    - fixed_mask:
        type: file
        description: Fixed image mask
        pattern: "*.{nii,nii.gz}"
        mandatory: false
        ontologies:
          - edam: http://edamontology.org/format_4001 # NIFTI format
    - moving_mask:
        type: file
        description: Moving image mask
        pattern: "*.{nii,nii.gz}"
        mandatory: false
        ontologies:
          - edam: http://edamontology.org/format_4001 # NIFTI format
output:
  image_warped:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_warped.nii.gz":
          type: file
          description: Anatomical image warped to DWI space
          pattern: "*_warped.nii.gz"
          ontologies:
            - edam: http://edamontology.org/format_4001 # NIFTI format
  fixed_warped:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_warped_reference.nii.gz":
          type: file
          description: Fixed image warped to moving space.
          pattern: "*_warped_reference.nii.gz"
          ontologies:
            - edam: http://edamontology.org/format_4001 # NIFTI format
  forward_affine:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_forward1_affine.mat":
          type: file
          description: Affine transformation matrix to fixed space.
          pattern: "*_forward1_affine.mat"
          ontologies: []
  forward_warp:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_forward0_warp.nii.gz":
          type: file
          description: Deformation field to fixed space.
          pattern: "*_forward0_warp.nii.gz"
          ontologies:
            - edam: http://edamontology.org/format_4001 # NIFTI format
  backward_warp:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_backward1_warp.nii.gz":
          type: file
          description: Deformation field to moving space.
          pattern: "*_backward1_warp.nii.gz"
          ontologies:
            - edam: http://edamontology.org/format_4001 # NIFTI format
  backward_affine:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_backward0_affine.mat":
          type: file
          description: Affine transformation matrix to moving space.
          pattern: "*_backward0_affine.mat"
          ontologies: []
  forward_image_transform:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_forward*.{nii.gz,mat}":
          type: list
          description: |
            Tuple, Transformation files to warp images in fixed space, in the correct order
            for REGISTRATION_TRANSFORMTRACTOGRAM : [ meta, [ forward_warp, forward_affine ] ].
          pattern: "*_forward*.{nii.gz,mat}"
          ontologies: []
  backward_image_transform:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_backward*.{nii.gz,mat}":
          type: list
          description: |
            Tuple, transformation files to warp images in moving space, in the correct order
            for REGISTRATION_TRANSFORMTRACTOGRAM : [ meta, [ backward_affine, backward_warp ] ].
          pattern: "*_backward*.{nii.gz,mat}"
          ontologies: []
  forward_tractogram_transform:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_backward*.{nii.gz,mat}":
          type: list
          description: |
            Tuple, transformation files to warp tractograms into fixed space, in the correct order
            for REGISTRATION_TRANSFORMTRACTOGRAM : [ meta, [ backward_affine, backward_warp ] ].
          pattern: "*_backward*.{nii.gz,mat}"
          ontologies: []
  backward_tractogram_transform:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_forward*.{nii.gz,mat}":
          type: list
          description: |
            Tuple, transformation files to warp tractograms into moving space, in the correct order
            for REGISTRATION_TRANSFORMTRACTOGRAM : [ meta, [ forward_affine, forward_warp ] ].
          pattern: "*_forward*.{nii.gz,mat}"
          ontologies: []
  mqc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_registration_anattodwi_mqc.gif":
          type: file
          description: |
            .gif file containing quality control image for the
            registration process. For use in MultiQC report.
          pattern: "*_registration_anattodwi_mqc.gif"
          mandatory: false
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML

authors:
  - "@medde"
  - "@AlexVCaron"
