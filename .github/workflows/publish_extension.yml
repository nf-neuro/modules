name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name of the extension to deploy"
        required: true
        type: string
  workflow_call:
    inputs:
      name:
        description: "Name of the extension to deploy"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .vscode/${{ inputs.name }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: .vscode/${{ inputs.name }}/package-lock.json

      - name: npm clean install
        working-directory: .vscode/${{ inputs.name }}
        run: npm ci

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        with:
          packagePath: .vscode/${{ inputs.name }}
          pat: ${{ secrets.VSCE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
