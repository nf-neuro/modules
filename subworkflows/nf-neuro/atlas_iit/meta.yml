# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "atlas_iit"
description: |
  This subworkflow fetches and processes the IIT Human Brain Atlas including the mean B0 image and bundle masks.
  The authors of the IIT WM atlas only provide track density images (TDI) which can be used to
  create binary bundle masks by applying a threshold. Therefore, in this subworkflow, we offer the option to
  apply such a threshold (with the values recommended by the IIT authors) to create binary bundle masks, or
  to simply output the TDI bundle maps which can also be used as weighted representations of the bundles
  for downstream analyses (e.g. for extracting metrics weighted by the TDI values).
  For more information about the atlas and the recommended thresholds, please refer to
  [this link](https://www.nitrc.org/frs/download.php/12417/IIT_Atlas_v.5.0_MANUAL.pdf)

  The user can also provide their own Mean B0 map and/or bundle masks directory, using the parameters
  `params.atlas_iit.b0` and `params.atlas_iit.bundle_masks_dir`, respectively.
  If provided, the subworkflow will use these inputs instead of downloading and processing them,
  which is particularily useful for processing on HPC.

  The Mean B0 maps as well as the bundle density maps used are in 182x218x182 matrix size.
  The Atlas is in the MNI152NLin6Asym template space (1mm resolution).
keywords:
  - atlas
  - iit
  - neuroimaging
  - bundles
  - template
components:
  - image/math
  - utils_options
input:
  - options:
      type: map
      description: Map of options for the atlas_iit subworkflow.
      mandatory: false
      entries:
        threshold_bundles:
          type: boolean
          description: If enabled, this will threshold the TDI bundle maps with the recommended thresholds to create binary bundle masks. If disabled, the subworkflow will output the TDI bundle maps.
          default: false
        smooth_sigma:
          type: float
          description: If `threshold_bundles` is enabled, this will apply a gaussian smoothing with the specified sigma to the TDI bundle maps before thresholding. This is based on the recommendation of the IIT atlas authors to apply some smoothing to the TDI maps before thresholding.
          default: 1.0
        atlas_iit_b0:
          type: string
          description: Path to a Mean B0 map of the IIT Human Brain Atlas. If provided, this input will be used instead of downloading the Mean B0 map.
          default: null
        atlas_iit_bundle_masks_dir:
          type: string
          description: Path to a directory containing IIT bundle masks. If provided, these inputs will be used instead of downloading and processing the bundle masks.
          default: null
        fetch_gm_desikan:
          type: boolean
          description: If 'true', also fetch the IIT GM Desikan parcellation atlas and its Look-Up Table, emitted on the `gm_atlas` and `gm_lut` channels. Both channels stay empty when this is 'false'.
          default: false
        atlas_iit_gm_atlas:
          type: string
          description: Path to the IIT GM Desikan atlas (IIT_GM_Desikan_atlas.nii.gz). If provided, this input will be used instead of downloading the atlas from NITRC.
          default: null
        atlas_iit_gm_lut:
          type: string
          description: Path to the IIT GM Desikan Look-Up Table. Accepts either a pre-converted JSON file or the raw tab-separated TXT distributed by NITRC (LUT_GM_Desikan_0to1.txt), which is converted to JSON locally without requiring internet access. If provided, this input will be used instead of downloading the LUT from NITRC.
          default: null
output:
  - bundle_masks:
      type: file
      description: |
        List of IIT binary bundle masks.
      structure:
        - bundle_masks:
            type: file
            description: List of IIT binary bundle mask files.
      pattern: "*.nii.gz"
      ontologies:
        - edam: http://edamontology.org/format_4001 # NIFTI format
  - b0:
      type: file
      description: |
        Mean B0 map of the IIT Human Brain Atlas.
      structure:
        - b0:
            type: file
            description: Mean B0 image file.
      pattern: "*_b0.nii.gz"
      ontologies:
        - edam: http://edamontology.org/format_4001 # NIFTI format
  - gm_atlas:
      type: file
      description: |
        IIT GM Desikan parcellation atlas, in the atlas' template space.
        Empty unless `fetch_gm_desikan` is enabled.
      structure:
        - gm_atlas:
            type: file
            description: GM Desikan parcellation labelmap file.
      pattern: "*.nii.gz"
      ontologies:
        - edam: http://edamontology.org/format_4001 # NIFTI format
  - gm_lut:
      type: file
      description: |
        JSON Look-Up Table mapping the GM Desikan label indices to region names.
        Empty unless `fetch_gm_desikan` is enabled.
      structure:
        - gm_lut:
            type: file
            description: GM Desikan Look-Up Table, as JSON.
      pattern: "*.json"
      ontologies:
        - edam: http://edamontology.org/format_3464 # JSON format
  - versions:
      type: file
      description: |
        File containing software versions
      structure:
        - versions:
            type: file
            description: Versions YAML file.
      pattern: "versions.yml"
authors:
  - "@levje"
maintainers:
  - "@levje"
